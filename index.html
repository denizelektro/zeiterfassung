  .login{height:100dvh}

function feiertag(iso){
  var j=+iso.slice(0,4), fest={'01-01':'Neujahr','05-01':'Tag der Arbeit','10-03':'Tag der Dt. Einheit','11-01':'Allerheiligen','12-25':'1. Weihnachtstag','12-26':'2. Weihnachtstag'};
  if(fest[iso.slice(5)]) return fest[iso.slice(5)];
  var a=j%19,b=Math.floor(j/100),c=j%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mon=Math.floor((h+l-7*m+114)/31),tag=((h+l-7*m+114)%31)+1;
  var o=new Date(j,mon-1,tag,12), bew={'-2':'Karfreitag','1':'Ostermontag','39':'Christi Himmelfahrt','50':'Pfingstmontag','60':'Fronleichnam'};
  for(var x in bew){ var t=new Date(o); t.setDate(t.getDate()+(+x)); if(isoD(t)===iso) return bew[x]; }

var _beschaeftigt=0;
function beschaeftigt(n){ _beschaeftigt=Math.max(0,_beschaeftigt+n); document.body.classList.toggle('busy', _beschaeftigt>0); }
function rufe(aktion, daten){
  // Doppel-Tippen nur bei echten Speicher-Aktionen verhindern (Lesen und Stempeln blockieren nichts)
  var schreibend=['eintragLoeschen','abwesenheit','tagAbschliessen','tagOeffnen','baustelleSpeichern','baustelleLoeschen','mitarbeiterSpeichern','monatsbericht','monatEntsperren','meldungSenden'].indexOf(aktion)>=0 || (aktion==='eintragSpeichern' && !(daten&&daten._hintergrund));
  if(schreibend) beschaeftigt(1);
  var p = rufeRoh(aktion, daten);
  if(schreibend) p.then(function(){ beschaeftigt(-1); }, function(){ beschaeftigt(-1); });
  return p;
}
function rufeRoh(aktion, daten){
  return new Promise(function(ok, nein){
    google.script.run.withSuccessHandler(function(r){
      if(!r.ok){ if(r.fehler==='ANMELDUNG'){ abmeldenLokal(); return nein({anmeldung:true}); } return nein({fehler:r.fehler}); }
      ok(r.daten);
    }).withFailureHandler(function(e){ nein({netz:true, e:e}); }).api(S.token, aktion, daten);
  });
}

  el.classList.remove('hidden'); el.textContent = (tr()?'İnternet yok – '+n+' kayıt sonra gönderilecek · ':'')+'Offline – '+n+' Buchung(en) werden später gesendet'; }
/** Buchung senden; bei fehlendem Netz merken und lokal anzeigen. */
/** Buchung: sofort anzeigen, im Hintergrund an Google senden (bei fehlendem Netz später). */
function buchen(aktion, daten){
  if(aktion==='eintragSpeichern') daten._hintergrund=1;
  lokalAnwenden(aktion,daten); render();
  var q=schlange(); q.push({a:aktion,d:daten}); setzeSchlange(q);
  schlangeSenden();
  return Promise.resolve();
}
var sendetGerade=false;
function schlangeSenden(){
  var q=schlange(); if(!q.length||sendetGerade||!S.token) return;
  sendetGerade=true;
  rufeRoh(q[0].a, q[0].d).then(function(m){ q=schlange(); q.shift(); setzeSchlange(q); sendetGerade=false;
      if(q.length) schlangeSenden(); else { monatSetzen(m); if(!$('blatt').classList.contains('an')) render(); } })
  .catch(function(f){ sendetGerade=false; if(!f.netz){ q=schlange(); q.shift(); setzeSchlange(q); toast(fehlerText(f));
      ladeMonat(S.nutzer.id, monatVon(heuteIso())).then(function(){ render(); }).catch(function(){}); } });
}

function schl(ma,m){ return ma+'|'+m; }

function lokalAnwenden(aktion, d){
  var m = monatDaten(S.nutzer.id, monatVon(d.datum || (d.eintrag&&d.eintrag.datum) || heuteIso()));
  if(!m){ m={ma:S.nutzer.id,monat:monatVon(d.datum||d.eintrag.datum),eintraege:[],abgeschlossen:[],gesperrt:false}; monatSetzen(m); }
  if(aktion==='stempeln'){
    var l=S.laufend;
    var find=function(id){ return m.eintraege.filter(function(e){return e.id===id;})[0]; };
    var beenden=function(){ var e=find(l.id); var p=l.pause+(l.pauseStart?Math.max(0,minDiff(l.pauseStart,d.zeit)):0); if(e){ e.ende=d.zeit; e.pause=p; e.pauseStart=''; } S.laufend=null; };
    if(d.art==='beginn'||d.art==='wechsel'){ if(l&&d.art==='wechsel') beenden(); var n={id:d.id,ma:S.nutzer.id,datum:d.datum,typ:'A',baustelle:d.baustelle,start:d.zeit,ende:'',pause:0,pauseStart:'',taetigkeit:'',material:[],km:''}; m.eintraege.push(n); S.laufend=JSON.parse(JSON.stringify(n)); }

      if(d.art==='weiter'&&l.pauseStart){ l.pause+=Math.max(0,minDiff(l.pauseStart,d.zeit)); e.pause=l.pause; l.pauseStart=e.pauseStart=''; }
      if(d.art==='ende') beenden(); }

  if(cache){ try{ startSetzen(cache); var mc=JSON.parse(LS.getItem('ze_monate')||'{}'); for(var k in mc) S.monate[k]=mc[k];
    S.laufend=JSON.parse(LS.getItem('ze_laufend')||'null');

  });
  var summe = liste.reduce(function(s,e){return s+std(e);},0);
  var pw = pausenWarnung(liste); if(pw) h+='<div class="hinweis">⚠ '+pw+'</div>';
  if(summe>0) h+='<div style="text-align:right;font-weight:800;color:var(--navy);margin:4px 2px 10px">Σ '+fStd(summe)+' '+(tr()?'saat / ':'')+'Std.</div>';
  var zu = m.abgeschlossen && m.abgeschlossen.indexOf(datum)>=0;

/** Arbeitszeitgesetz: >6 Std. → 30 Min. Pause, >9 Std. → 45 Min. */
function pausenWarnung(liste){
  var a=liste.filter(function(e){return e.typ==='A'&&e.ende;}); if(!a.length) return '';
  var h=a.reduce(function(s,e){return s+std(e);},0), p=a.reduce(function(s,e){return s+(+e.pause||0);},0), soll = h>9?45:(h>6?30:0);
  if(p>=soll) return '';
  return tr() ? '<b>Mola eksik: '+p+' dk, en az '+soll+' dk gerekli</b><br>Zu wenig Pause: '+p+' Min., mindestens '+soll+' Min. nötig'
              : 'Zu wenig Pause: '+p+' Min. gebucht, bei '+fStd(h)+' Std. Arbeit mindestens '+soll+' Min. nötig';
}
/* ======================= Wischen zum Löschen ======================= */
function swAuf(e, darf){ return darf ? '<div class="sw" data-id="'+e.id+'"><button class="weg" onclick="eintragWeg(\''+e.id+'\')">🗑<span>'+(tr()?'Sil':'Löschen')+'</span></button><div class="vorne">' : '<div><div>'; }
function swZu(){ return '</div></div>'; }
function swipeAktivieren(root){
  if(!root) return;
  root.querySelectorAll('.sw').forEach(function(sw){
    var v=sw.querySelector('.vorne'), x0=null, y0=null, dx=0, offen=false, horiz=null;
    var zu=function(){ offen=false; v.style.transform=''; };
    v.addEventListener('pointerdown',function(e){ x0=e.clientX; y0=e.clientY; dx=0; horiz=null; v.classList.add('zieht'); });
    v.addEventListener('pointermove',function(e){ if(x0===null) return; var mx=e.clientX-x0, my=e.clientY-y0;
      if(horiz===null && (Math.abs(mx)>8||Math.abs(my)>8)) horiz=Math.abs(mx)>Math.abs(my);
      if(!horiz) return; dx=Math.max(-110,Math.min(0,(offen?-96:0)+mx)); v.style.transform='translateX('+dx+'px)'; wischen.sperre=true; });
    var ende=function(){ if(x0===null) return; v.classList.remove('zieht'); x0=null;
      if(horiz){ if(dx<-45){ offen=true; v.style.transform='translateX(-96px)'; } else zu(); v.dataset.gewischt='1'; setTimeout(function(){ v.dataset.gewischt=''; wischen.sperre=false; },350); } };
    v.addEventListener('pointerup',ende); v.addEventListener('pointercancel',ende); v.addEventListener('pointerleave',ende);
    v.addEventListener('click',function(e){ if(v.dataset.gewischt||offen){ e.stopPropagation(); e.preventDefault(); if(offen&&!v.dataset.gewischt) zu(); } }, true);
  });
}

  var j=+mo.slice(0,4), m=+mo.slice(5,7), erster=new Date(j,m-1,1), versatz=(erster.getDay()+6)%7, tage=new Date(j,m,0).getDate(), heute=heuteIso();

function formSpeichern(){

    var mr=new MediaRecorder(strom, typ?{mimeType:typ}:undefined), teile=[], t0=Date.now();

function abwesenheitForm(){
  var h='<h2>'+L('abwesend')+'</h2><div class="seg" id="abwTyp"><button class="an" data-t="U" onclick="abwTyp(this)">🏖 '+L('urlaub')+'</button><button data-t="K" onclick="abwTyp(this)">🤒 '+L('krank')+'</button><button data-t="UU" onclick="abwTyp(this)">⏸ '+L('uu')+'</button></div>'+
    '<div class="reihe"><div><label class="f">'+L('von','inl')+'</label><input type="date" class="eing" id="aVon" value="'+heuteIso()+'"></div><div><label class="f">'+L('bis','inl')+'</label><input type="date" class="eing" id="aBis" value="'+heuteIso()+'"></div></div>'+
    '<p class="klein">'+(tr()?'Hafta sonu ve resmi tatiller otomatik atlanır.<br>':'')+'Wochenenden und Feiertage werden automatisch übersprungen.</p>'+
    '<div id="fFehler"></div><button class="gross b-blau" onclick="abwSpeichern()">💾 '+L('speichern')+'</button><div style="height:8px"></div><button class="mittel b-hell" onclick="schliesseBlatt()">'+L('abbrechen')+'</button>';
  oeffneBlatt(h);
}
function abwTyp(b){ document.querySelectorAll('#abwTyp button').forEach(function(x){x.classList.remove('an');}); b.classList.add('an'); }
function abwSpeichern(){
  var typ=document.querySelector('#abwTyp .an').dataset.t, von=$('aVon').value, bis=$('aBis').value;
  if(!von||!bis||bis<von) return fFehler(Lt('ENDE_VOR_BEGINN'));
  rufe('abwesenheit',{ma:S.ma||S.nutzer.id, typ:typ, von:von, bis:bis}).then(function(m){ monatSetzen(m);
    var bisM=monatVon(bis); if(bisM!==monatVon(von)) delete S.monate[schl(m.ma,bisM)];
    S.uebersicht=null; schliesseBlatt(); toast('✓'); render(); }).catch(function(f){ fFehler(fehlerText(f)); });
}

/* ======================= VERWALTUNG (nur Admin) ======================= */
function zeigeVerwaltung(){
  var h='<div class="tabs">'+[['monat','Monat'],['abrechnung','Abrechnung'],['baustellen','Baustellen'],['team','Team']].map(function(t){return '<button class="'+(S.adminTab===t[0]?'an':'')+'" onclick="S.adminTab=\''+t[0]+'\';zeigeVerwaltung()">'+t[1]+'</button>';}).join('')+'</div>';
  if(S.adminTab==='monat'){
    h+='<div class="kal-kopf"><button class="pfeil" onclick="S.adminMonat=monatPlus(S.adminMonat,-1);S.uebersicht=null;zeigeVerwaltung()">‹</button><div class="mon">'+DE_MON[+S.adminMonat.slice(5,7)-1]+' '+S.adminMonat.slice(0,4)+'</div><button class="pfeil" onclick="S.adminMonat=monatPlus(S.adminMonat,1);S.uebersicht=null;zeigeVerwaltung()">›</button></div>';
    if(!S.uebersicht || S.uebersicht.monat!==S.adminMonat){
      $('inhalt').innerHTML=h+'<div class="lade" style="min-height:200px">…</div>';
      var mo=S.adminMonat; rufe('uebersicht',{monat:mo}).then(function(u){ S.uebersicht={monat:mo,liste:u}; if(S.ansicht==='verwaltung') zeigeVerwaltung(); }).catch(function(f){ toast(fehlerText(f)); });
      return;
    }
    S.uebersicht.liste.forEach(function(p){
      h+='<div class="karte"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:1.05rem">'+esc(p.name)+'</b>'+(p.gesperrt?'<span class="pill p-gruen">🔒 abgerechnet</span>':'')+'</div>'+
        '<div class="summe" style="margin:10px 0"><div class="kachel" style="background:var(--bg)"><div class="w">'+fStd(p.stunden)+'</div><div class="l">Stunden</div></div><div class="kachel" style="background:var(--bg)"><div class="w">'+p.tage+'</div><div class="l">Arbeitstage</div></div>'+
        '<div class="kachel" style="background:var(--bg)"><div class="w">'+p.urlaub+' / '+p.krank+'</div><div class="l">Urlaub / Krank</div></div><div class="kachel" style="background:var(--bg)"><div class="w">'+fStd(p.km)+'</div><div class="l">km</div></div></div>'+
        (p.urlaubKonto&&p.urlaubKonto.anspruch?'<div class="klein" style="margin-bottom:8px">🏖 Urlaub '+p.urlaubKonto.jahr+': <b>'+p.urlaubKonto.genommen+'</b> von '+p.urlaubKonto.anspruch+' genommen · <b style="color:var(--blau)">Rest '+p.urlaubKonto.rest+' Tage</b></div>':'<div class="klein" style="margin-bottom:8px">🏖 Urlaubsanspruch noch nicht eingetragen (Team → Bearbeiten)</div>')+
        (p.offen?'<div class="hinweis">⚠ '+p.offen+' Arbeitstag(e) noch nicht abgeschlossen</div>':'')+
        (p.pausenTage&&p.pausenTage.length?'<div class="hinweis">⚠ Zu wenig Pause an '+p.pausenTage.length+' Tag(en): '+p.pausenTage.map(function(t){return t.slice(8,10)+'.'+t.slice(5,7)+'.';}).join(', ')+'</div>':'')+
        '<button class="mittel b-hell" style="margin-bottom:8px" onclick="S.ma=\''+p.id+'\';abwesenheitForm()">🏖 Urlaub / Krank eintragen</button>'+
        '<div class="reihe"><button class="mittel b-hell" onclick="S.ma=\''+p.id+'\';S.kalMonat=S.adminMonat;gehe(\'kalender\')">📅 Kalender</button>'+
        '<button class="mittel b-navy" style="color:#fff" id="mb_'+p.id+'" onclick="bericht(\''+p.id+'\')">📄 '+(p.pdfUrl?'Neu erstellen':'Stundenzettel')+'</button></div>'+
        (p.pdfUrl?'<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px"><a class="link" href="'+p.pdfUrl+'" target="_blank">PDF öffnen</a><a class="link" href="'+p.tabelleUrl+'" target="_blank">Tabelle öffnen</a>'+(p.gesperrt?'<button class="link" style="color:var(--rot)" onclick="entsperren(\''+p.id+'\')">Entsperren</button>':'')+'</div>':'')+
        '</div>';
    });
    h+='<p class="klein">Der Stundenzettel wird als Tabelle + PDF in Google Drive unter „Zeiterfassung/Monatsberichte“ gespeichert. Mitten im Monat ist er ein Zwischenstand; ist der Monat vorbei, wird er danach für den Mitarbeiter gesperrt (du kannst weiter korrigieren).</p>';
  }
  if(S.adminTab==='abrechnung'){ $('inhalt').innerHTML=h+abrechnungHtml(); return; }
  if(S.adminTab==='baustellen'){
    h+='<div class="karte"><p class="titel">Neue Baustelle</p><input class="eing" id="nbName" placeholder="Name / Kunde (z. B. Sonnenhagen Hannover)"><div style="height:8px"></div><input class="eing" id="nbAdr" placeholder="Adresse (optional)"><div style="height:10px"></div><button class="mittel b-gruen" style="color:#fff" onclick="bsSpeichern()">＋ Anlegen</button></div>';
    h+='<div class="karte">'+(S.alleBaustellen.length?S.alleBaustellen.map(function(b){ return '<div class="zeileL"><div><b style="'+(b.aktiv?'':'opacity:.45')+'">'+esc(b.name)+'</b>'+(b.adresse?'<div class="klein">'+esc(b.adresse)+'</div>':'')+(b.fuer?'<div class="klein">👤 nur '+esc(b.fuerName)+' · <button class="link" onclick="bsFreigeben(\''+b.id+'\')">für alle freigeben</button></div>':'')+'</div>'+
      '<div style="display:flex;gap:6px">'+(b.adresse?'<button class="pill p-blau" onclick="navi(\''+b.id+'\')">📍</button>':'')+'<button class="pill p-rot" onclick="bsLoeschen(\''+b.id+'\')">🗑</button>'+'<button class="pill p-grau" onclick="bsBearbeiten(\''+b.id+'\')">✎</button><button class="pill '+(b.aktiv?'p-gruen':'p-grau')+'" onclick="bsAktiv(\''+b.id+'\','+(!b.aktiv)+')">'+(b.aktiv?'aktiv':'beendet')+'</button></div></div>'; }).join(''):'<div class="leer">Noch keine Baustellen</div>')+'</div>';
    h+='<p class="klein">„Beendet“ blendet die Baustelle in Ahmets Auswahl aus; alte Einträge bleiben erhalten.</p>';
  }
  if(S.adminTab==='team'){
    h+='<div class="karte">'+S.mitarbeiter.map(function(m){ return '<div class="zeileL"><div><b style="'+(m.aktiv?'':'opacity:.45')+'">'+esc(m.name)+'</b><div class="klein">'+(m.rolle==='admin'?'Admin':'Mitarbeiter')+' · '+(m.sprache==='tr'?'Türkisch + Deutsch':'Deutsch')+'</div></div><button class="pill p-grau" onclick="maForm(\''+m.id+'\')">✎ Bearbeiten</button></div>'; }).join('')+'</div>'+
       '<button class="mittel b-hell" onclick="maForm(null)">＋ Mitarbeiter hinzufügen</button>';
    if(istPC()) h+='<div class="karte" style="margin-top:14px"><p class="titel">🤖 KI für Sprache, Foto & Belege '+(S.kiAktiv?'<span class="pill p-gruen">aktiv</span>':'<span class="pill p-grau">aus</span>')+'</p>'+
      '<p class="klein">Kostenloser Schlüssel von Google: <a class="link" href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> öffnen → „API-Schlüssel erstellen“ → kopieren und hier einfügen.</p>'+
      '<input class="eing" id="kiKey" placeholder="'+(S.kiAktiv?'neuer Schlüssel (optional)':'API-Schlüssel einfügen')+'" autocomplete="off"><div style="height:8px"></div>'+
      '<button class="mittel b-navy" style="color:#fff" onclick="kiKeySpeichern()">Speichern & testen</button></div>';
  }
  $('inhalt').innerHTML=h;
}
function bericht(id){
  var b=$('mb_'+id); b.disabled=true; b.innerHTML='⏳ wird erstellt…';
  rufe('monatsbericht',{ma:id, monat:S.adminMonat}).then(function(r){ S.uebersicht={monat:S.adminMonat,liste:r.uebersicht}; zeigeVerwaltung(); toast('✓ Stundenzettel erstellt');
      oeffneBlatt('<h2>✓ Stundenzettel erstellt</h2><p>Gespeichert in Google Drive unter <b>Zeiterfassung › Monatsberichte</b>.</p><a class="mittel b-navy" style="color:#fff;text-decoration:none" href="'+r.pdfUrl+'" target="_blank">📄 PDF öffnen</a><div style="height:8px"></div><a class="mittel b-hell" style="text-decoration:none" href="'+r.tabelleUrl+'" target="_blank">Tabelle öffnen</a>'); })
   .catch(function(f){ b.disabled=false; b.innerHTML='📄 Stundenzettel'; oeffneBlatt('<h2>Noch nicht möglich</h2><div class="fehlerbox">'+esc(fehlerText(f))+'</div><div style="height:12px"></div><button class="mittel b-hell" onclick="schliesseBlatt()">OK</button>'); });
}
function entsperren(id){ frage('Monat wieder freigeben? Der Mitarbeiter kann dann wieder ändern.', 'Entsperren', function(){ entsperrenJetzt(id); }); }
function entsperrenJetzt(id){
  rufe('monatEntsperren',{ma:id, monat:S.adminMonat}).then(function(u){ S.uebersicht={monat:S.adminMonat,liste:u}; delete S.monate[schl(id,S.adminMonat)]; zeigeVerwaltung(); }).catch(function(f){ toast(fehlerText(f)); }); }
function istPC(){ try{ return matchMedia('(pointer:fine)').matches && !matchMedia('(pointer:coarse)').matches && window.innerWidth>=700; }catch(e){ return false; } }
/* ======================= Abrechnung je Baustelle ======================= */
var AB={bs:'', von:'', bis:'', daten:null};
function abSatz(id){ var v=LS.getItem('ze_satz_'+id); return v===null?'':v; }
function abAufschlag(){ var v=LS.getItem('ze_aufschlag'); return v===null?'30':v; }
function zahl(v){ var n=parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }
function abrechnungHtml(){
  if(!AB.von){ var t=heuteIso(); AB.von=t.slice(0,8)+'01'; AB.bis=t; }
  var bsl=S.alleBaustellen.length?S.alleBaustellen:S.baustellen;
  if(!AB.bs && bsl[0]) AB.bs=(S.auswahlBs||bsl[0].id);
  var h='<div class="karte"><p class="titel">Abrechnung für sevdesk</p>'+
    '<label class="f">Baustelle</label><select class="eing" id="abBs" onchange="AB.bs=this.value;AB.daten=null">'+bsl.map(function(b){return '<option value="'+b.id+'" '+(b.id===AB.bs?'selected':'')+'>'+esc(b.name)+'</option>';}).join('')+'</select>'+
    '<div class="reihe"><div><label class="f">Von</label><input type="date" class="eing" id="abVon" value="'+AB.von+'" onchange="AB.von=this.value;AB.daten=null"></div><div><label class="f">Bis</label><input type="date" class="eing" id="abBis" value="'+AB.bis+'" onchange="AB.bis=this.value;AB.daten=null"></div></div>'+
    '<div style="height:10px"></div><button class="mittel b-navy" style="color:#fff" onclick="abLaden()">Anzeigen</button></div>';
  var a=AB.daten; if(!a) return h;
  var auf=abAufschlag(), lohn=0, ek=0;
  h+='<div class="karte"><p class="titel">'+esc(a.baustelle.name)+'</p>'+(a.baustelle.adresse?'<div class="klein">'+esc(a.baustelle.adresse)+'</div>':'')+
     '<div class="klein">'+deD(a.von)+' – '+deD(a.bis)+'</div>'+(a.offen?'<div class="hinweis" style="margin-top:8px">⚠ '+a.offen+' Eintrag/Einträge noch ohne Feierabend – Stunden fehlen dort.</div>':'')+'</div>';
  h+='<div class="karte"><p class="titel">⏱ Arbeitszeit</p>'+(a.personen.length?a.personen.map(function(p){ var sz=abSatz(p.id), sum=p.stunden*zahl(sz); lohn+=sum;
      return '<div class="zeileL"><div><b>'+esc(p.name)+'</b><div class="klein">'+fStd(p.stunden)+' Std. · '+p.tage+' Tag(e)</div></div><div style="display:flex;align-items:center;gap:6px"><input class="eing" style="width:78px;padding:8px" inputmode="decimal" placeholder="€/Std" value="'+esc(sz)+'" onchange="LS.setItem(\'ze_satz_'+p.id+'\',this.value);zeigeVerwaltung()"><b style="min-width:84px;text-align:right">'+euro(sum)+'</b></div></div>'; }).join(''):'<div class="leer">Keine Stunden</div>')+
     '<div style="text-align:right;font-weight:800;margin-top:6px">'+euro(lohn)+'</div></div>';
  var fehlt=0;
  h+='<div class="karte"><p class="titel">📦 Material <span class="klein">Aufschlag <input class="eing" style="width:58px;padding:6px;display:inline-block" inputmode="decimal" value="'+esc(auf)+'" onchange="LS.setItem(\'ze_aufschlag\',this.value);zeigeVerwaltung()"> %</span></p>'+
     (a.material.length?a.material.map(function(m){ ek+=m.ek; if(m.ohnePreis) fehlt++;
       return '<div class="zeileL"><div><b>'+esc(String(m.menge).replace('.',','))+' '+esc(m.einheit)+'</b> '+esc(m.text)+(m.ohnePreis?' <span class="pill p-gelb">Preis fehlt</span>':'')+'</div><div style="text-align:right;white-space:nowrap"><div class="klein">EK '+euro(m.ek)+'</div><b>'+euro(m.ek*(1+zahl(auf)/100))+'</b></div></div>'; }).join(''):'<div class="leer">Kein Material</div>')+
     '<div style="text-align:right;margin-top:6px"><span class="klein">EK '+euro(ek)+'</span> · <b>VK '+euro(ek*(1+zahl(auf)/100))+'</b></div>'+
     (fehlt?'<div class="klein" style="margin-top:6px">Preise fehlen? Eintrag im Kalender öffnen und das €‑Feld ausfüllen.</div>':'')+'</div>';
  var ges=lohn+ek*(1+zahl(auf)/100);
  h+='<div class="karte" style="text-align:center"><div class="klein">Gesamt netto</div><div style="font-size:1.6rem;font-weight:800;color:var(--navy)">'+euro(ges)+'</div><div class="klein">zzgl. 19 % MwSt. = '+euro(ges*1.19)+' brutto'+(a.km?' · '+fStd(a.km)+' km gefahren':'')+'</div></div>';
  if(a.belege.length) h+='<div class="karte"><p class="titel">🧾 Belege</p><div class="belege">'+a.belege.map(function(b){ return '<span><a href="https://drive.google.com/file/d/'+esc(b.id)+'/view" target="_blank">🧾 '+esc(b.name.replace(/\.jpg$/,''))+'</a></span>'; }).join('')+'</div></div>';
  if(a.tage.length) h+='<div class="karte"><p class="titel">📅 Tage & Tätigkeiten</p>'+a.tage.map(function(t){ return '<div class="zeileL"><div><b>'+deD(t.datum)+'</b> · '+esc(t.ma)+'<div class="klein">'+esc(t.taetigkeit||'—')+'</div></div><div class="klein" style="white-space:nowrap">'+t.start+'–'+(t.ende||'…')+' · '+fStd(t.std)+' h</div></div>'; }).join('')+'</div>';
  h+='<button class="mittel b-gruen" style="color:#fff" id="abTab" onclick="abTabelle()">📄 Als Tabelle in Google Drive speichern</button>'+
     '<p class="klein">Wird gespeichert unter „Gewerbe › Rechn.-Angebot › '+AB.bis.slice(0,4)+' › '+esc(a.baustelle.name)+' vorläufige Rechnung“. Daraus trägt Claude die Rechnung in sevdesk ein.</p>';
  return h;
}
function deD(i){ return i.slice(8,10)+'.'+i.slice(5,7)+'.'+i.slice(0,4); }
function abLaden(){
  AB.bs=$('abBs').value; AB.von=$('abVon').value; AB.bis=$('abBis').value;
  $('inhalt').insertAdjacentHTML('beforeend','<div class="lade" style="min-height:120px">…</div>');
  rufe('abrechnung',{baustelle:AB.bs, von:AB.von, bis:AB.bis}).then(function(a){ AB.daten=a; zeigeVerwaltung(); }).catch(function(f){ toast(fehlerText(f)); zeigeVerwaltung(); });
}
function abTabelle(){
  var b=$('abTab'); b.disabled=true; b.innerHTML='⏳ wird erstellt…';
  var saetze={}; (AB.daten.personen||[]).forEach(function(p){ saetze[p.id]=zahl(abSatz(p.id)); });
  rufe('abrechnungTabelle',{baustelle:AB.bs, von:AB.von, bis:AB.bis, saetze:saetze, aufschlag:zahl(abAufschlag())}).then(function(r){
    b.disabled=false; b.innerHTML='📄 Als Tabelle in Google Drive speichern';
    oeffneBlatt('<h2>✓ Vorläufige Rechnung gespeichert</h2><p>In Google Drive unter <b>Gewerbe › Rechn.-Angebot › '+AB.bis.slice(0,4)+'</b>.</p><a class="mittel b-navy" style="color:#fff;text-decoration:none" href="'+r.url+'" target="_blank">Tabelle öffnen</a><div style="height:8px"></div><a class="mittel b-hell" style="text-decoration:none" href="'+r.ordner+'" target="_blank">Ordner öffnen</a>');
  }).catch(function(f){ b.disabled=false; b.innerHTML='📄 Als Tabelle in Google Drive speichern'; toast(fehlerText(f)); });
}
function kiKeySpeichern(){
  var k=$('kiKey').value.trim(); if(!k) return;
  rufe('kiSchluessel',{schluessel:k}).then(function(r){ S.kiAktiv=r.kiAktiv; try{ var st=JSON.parse(LS.getItem('ze_start')); st.kiAktiv=r.kiAktiv; LS.setItem('ze_start',JSON.stringify(st)); }catch(e){} toast('✓ KI aktiv'); zeigeVerwaltung(); })
    .catch(function(f){ toast(fehlerText(f)); });
}
function nachAdmin(d){ startSetzen(d); zeigeVerwaltung(); }
function bsSpeichern(){ var n=$('nbName').value.trim(); if(!n) return toast('Name fehlt'); rufe('baustelleSpeichern',{baustelle:{name:n, adresse:$('nbAdr').value}}).then(function(d){ nachAdmin(d); toast('✓ Baustelle angelegt – erscheint sofort bei allen'); }).catch(function(f){ toast(fehlerText(f)); }); }
function bsLoeschen(id){ var b=S.alleBaustellen.filter(function(x){return x.id===id;})[0];
  frage('Baustelle „'+esc(b.name)+'“ löschen?', '🗑 Löschen', function(){ rufe('baustelleLoeschen',{id:id}).then(function(d){ nachAdmin(d); toast('✓ gelöscht'); }).catch(function(f){ toast(fehlerText(f)); }); }); }
function bsFreigeben(id){ var b=S.alleBaustellen.filter(function(x){return x.id===id;})[0]; rufe('baustelleSpeichern',{baustelle:{id:id,name:b.name,adresse:b.adresse,aktiv:b.aktiv,fuer:''}}).then(function(d){ nachAdmin(d); toast('✓ für alle sichtbar'); }).catch(function(f){ toast(fehlerText(f)); }); }
function bsAktiv(id, an){ var b=S.alleBaustellen.filter(function(x){return x.id===id;})[0]; rufe('baustelleSpeichern',{baustelle:{id:id,name:b.name,adresse:b.adresse,aktiv:an}}).then(nachAdmin).catch(function(f){ toast(fehlerText(f)); }); }
function bsBearbeiten(id){ var b=S.alleBaustellen.filter(function(x){return x.id===id;})[0];
  oeffneBlatt('<h2>Baustelle bearbeiten</h2><label class="f">Name</label><input class="eing" id="ebName" value="'+esc(b.name)+'"><label class="f">Adresse</label><input class="eing" id="ebAdr" value="'+esc(b.adresse||'')+'"><div id="fFehler"></div><div style="height:14px"></div>'+
   '<button class="gross b-navy" onclick="rufe(\'baustelleSpeichern\',{baustelle:{id:\''+id+'\',name:$(\'ebName\').value,adresse:$(\'ebAdr\').value,aktiv:'+b.aktiv+'}}).then(function(d){schliesseBlatt();nachAdmin(d);}).catch(function(f){fFehler(fehlerText(f));})">Speichern</button>'); }
function maForm(id){
  var m = id ? S.mitarbeiter.filter(function(x){return x.id===id;})[0] : {name:'',rolle:'mitarbeiter',sprache:'tr',aktiv:true};
  oeffneBlatt('<h2>'+(id?'Mitarbeiter bearbeiten':'Neuer Mitarbeiter')+'</h2><label class="f">Name</label><input class="eing" id="mName" value="'+esc(m.name)+'">'+
    '<label class="f">Sprache der App</label><select class="eing" id="mSpr"><option value="tr" '+(m.sprache==='tr'?'selected':'')+'>Türkisch mit Deutsch darunter</option><option value="de" '+(m.sprache!=='tr'?'selected':'')+'>Deutsch</option></select>'+
    '<label class="f">Rolle</label><select class="eing" id="mRolle"><option value="mitarbeiter" '+(m.rolle!=='admin'?'selected':'')+'>Mitarbeiter (sieht nur sich selbst)</option><option value="admin" '+(m.rolle==='admin'?'selected':'')+'>Admin (sieht alles)</option></select>'+
    '<label class="f">'+(id?'Neue PIN (leer lassen = unverändert)':'PIN (4–8 Ziffern)')+'</label><input class="eing" id="mPin" inputmode="numeric" maxlength="8" autocomplete="off">'+
    '<label class="f">Urlaubstage pro Jahr</label><input class="eing" id="mUrlaub" inputmode="numeric" value="'+(m.urlaubJahr||'')+'" placeholder="z. B. 24">'+
    '<label class="f">Stundenlohn intern (€ brutto)</label><input class="eing" id="mLohn" inputmode="decimal" value="'+(m.stundenlohn||'')+'" placeholder="z. B. 18">'+
    '<div class="reihe"><div><label class="f">Restschuld/Guthaben ab Monat</label><input type="month" class="eing" id="mSMon" value="'+(m.saldoMonat||'')+'"></div><div><label class="f">Betrag € (− = Schuld)</label><input class="eing" id="mSal" inputmode="decimal" value="'+(m.saldoStart===''||m.saldoStart==null?'':String(m.saldoStart).replace('.',','))+'" placeholder="z. B. -1948,71"></div></div>'+
    '<label class="f">Davon '+new Date().getFullYear()+' schon genommen (vor der App)</label><input class="eing" id="mUrlaubVorher" inputmode="numeric" value="'+(m.urlaubStartJahr==String(new Date().getFullYear())?m.urlaubStartGenommen:'')+'" placeholder="z. B. 18">'+
    (id?'<label class="f" style="display:flex;align-items:center;gap:10px"><input type="checkbox" id="mAktiv" '+(m.aktiv?'checked':'')+' style="width:22px;height:22px"> Zugang aktiv</label>':'')+
    '<div id="fFehler"></div><div style="height:14px"></div><button class="gross b-navy" onclick="maSpeichern('+(id?'\''+id+'\'':'null')+')">Speichern</button>');
}
/* ======================= Monatsliste (intern): Stunden, Lohn, Vorschuss, Rest ======================= */
function eur2(x){ return (x<0?'−':'')+Math.abs(+x).toFixed(2).replace('.',',')+' €'; }
function monatsliste(){
  var ma = S.nutzer.rolle==='admin' ? (S.ma||S.nutzer.id) : S.nutzer.id, mo=S.kalMonat||monatVon(heuteIso());
  oeffneBlatt('<div class="lade" style="min-height:160px">…</div>');
  rufe('lohnliste',{ma:ma, monat:mo}).then(mlZeigen).catch(function(f){ oeffneBlatt('<p>'+fehlerText(f)+'</p>'); });
}
function mlZeigen(r){
  var adm=S.nutzer.rolle==='admin', h='<h2>📄 '+L('mListe')+' · '+esc(r.name)+'</h2><div class="klein" style="margin:-6px 0 8px">'+r.monat.slice(5)+'/'+r.monat.slice(0,4)+'</div>';
  h+='<div class="mlTab">'+r.tage.map(function(t){
    var g=t.geld.map(function(x){ return '<div class="mlGeld">💶 '+(x.art==='vorschuss'?Lt('mVorschuss'):x.art==='lohn'?Lt('mGezahlt'):'Sonstiges')+' '+eur2(x.betrag)+(x.notiz?' · '+esc(x.notiz):'')+(adm?' <button class="link" onclick="zahlungWeg(\''+x.id+'\',\''+r.ma+'\',\''+r.monat+'\')">✕</button>':'')+'</div>'; }).join('');
    if(!t.zeilen.length && !g) return '<div class="mlZ leer2"><span class="mlD">'+t.wt+' '+t.tag+'</span></div>';
    return t.zeilen.map(function(z,i){ return '<div class="mlZ"><span class="mlD">'+(i?'':t.wt+' '+t.tag)+'</span><span class="mlT">'+esc(z.text)+(z.start?'<small>'+z.start+'–'+(z.ende||'…')+(z.pause?' · '+z.pause+' min':'')+'</small>':'')+'</span><b>'+String(z.std).replace('.',',')+'</b></div>'; }).join('')+
      (t.zeilen.length?'':'<div class="mlZ"><span class="mlD">'+t.wt+' '+t.tag+'</span><span class="mlT"></span><b></b></div>')+g;
  }).join('')+'</div>';
  var neg=r.rest!=null&&r.rest<0;
  h+='<div class="karte" style="margin-top:10px">'+
    '<div class="zeileL"><span>'+L('mStd')+'</span><b>'+String(r.summe.bezahlt).replace('.',',')+' h</b></div>'+
    '<div class="klein" style="margin:-4px 0 6px">Arbeit '+String(r.summe.arbeit).replace('.',',')+' h · Krank '+r.summe.krank+' · Urlaub '+r.summe.urlaub+' · Feiertag '+r.summe.feiertag+' (je 8 h)'+(r.summe.unbezahlt?' · Unbez. '+r.summe.unbezahlt:'')+'</div>'+
    (r.satz?'<div class="zeileL"><span>'+L('mLohn')+' ('+String(r.satz).replace('.',',')+' €/h)</span><b>'+eur2(r.lohn)+'</b></div>':'')+
    (r.vortrag!=null?'<div class="zeileL"><span>'+L('mVortrag')+'</span><b>'+eur2(r.vortrag)+'</b></div>':'')+
    (r.gezahltLohn?'<div class="zeileL"><span>− '+L('mGezahlt')+'</span><b>'+eur2(r.gezahltLohn)+'</b></div>':'')+
    (r.vorschuss?'<div class="zeileL"><span>− '+L('mVorschuss')+'</span><b>'+eur2(r.vorschuss)+'</b></div>':'')+
    (r.sonstiges?'<div class="zeileL"><span>− Sonstiges</span><b>'+eur2(r.sonstiges)+'</b></div>':'')+
    (r.rest!=null?'<div class="zeileL" style="font-size:1.15rem"><span>'+L('mRest')+'</span><b style="color:'+(neg?'var(--rot)':'var(--gruen)')+'">'+eur2(r.rest)+'</b></div><div class="klein" style="text-align:right">'+(neg?Lt('mSchuld'):Lt('mGuthaben'))+'</div>':'')+
    '<div class="klein" style="margin-top:6px">🏖 '+Lt('urlaub')+' '+r.urlaub.jahr+': '+r.urlaub.anspruch+' · '+(tr()?'alındı':'genommen')+' '+r.urlaub.genommen+' · Rest '+r.urlaub.rest+'</div></div>';
  if(!adm){
    h+='<div class="karte"><p class="titel">💶 '+L('geldNeu')+'</p><div class="reihe"><div><label class="f">'+L('datum','inl')+'</label><input type="date" class="eing" id="zDat" value="'+heuteIso()+'"></div><div><label class="f">'+L('betrag','inl')+'</label><input class="eing" id="zBet" inputmode="decimal" placeholder="10"></div></div>'+
      '<div style="height:8px"></div><button class="gross b-navy" onclick="zahlungNeu(\''+r.ma+'\')">💾 '+L('speichern')+'</button>'+
      '<p class="klein">'+(tr()?'Patron bilgilendirilir. Düzeltme sadece patron yapabilir.<br>':'')+'Der Chef bekommt eine Nachricht. Ändern kann nur der Chef.</p></div>';
  }
  if(adm){
    h+='<div class="karte"><p class="titel">💶 Vorschuss / Lohn eintragen</p><div class="reihe"><div><label class="f">Datum</label><input type="date" class="eing" id="zDat" value="'+(r.monat===monatVon(heuteIso())?heuteIso():r.monat+'-28')+'"></div><div><label class="f">Betrag €</label><input class="eing" id="zBet" inputmode="decimal"></div></div>'+
      '<label class="f">Art</label><select class="eing" id="zArt"><option value="vorschuss">Vorschuss</option><option value="lohn">Lohn ausgezahlt</option><option value="sonstiges">Sonstiges</option></select>'+
      '<label class="f">Notiz</label><input class="eing" id="zNot" placeholder="optional"><div style="height:8px"></div>'+
      '<button class="mittel b-navy" style="color:#fff" onclick="zahlungNeu(\''+r.ma+'\')">Speichern</button></div>'+
      '<button class="mittel b-gruen" style="color:#fff" id="mlDat" onclick="mlDateien(\''+r.ma+'\',\''+r.monat+'\')">📁 Monatsliste + Steuerberater‑Tabelle in Drive speichern</button>'+
      '<p class="klein">Ordner: Privat › Installation_Technik › eleman › '+r.monat.slice(2,4)+'</p>'+
      (!r.satz||r.vortrag==null?'<p class="klein">Tipp: Stundenlohn und Start‑Restschuld unter Verwaltung → Team → Bearbeiten eintragen.</p>':'');
  }
  oeffneBlatt(h);
}
function zahlungNeu(ma){
  var z={ma:ma, datum:$('zDat').value, art:$('zArt')?$('zArt').value:'vorschuss', betrag:$('zBet').value, notiz:$('zNot')?$('zNot').value:''};
  if(!z.betrag) return toast('Betrag fehlt');
  rufe('zahlungSpeichern',{zahlung:z}).then(function(r){ mlZeigen(r); toast('✓ gespeichert'); }).catch(function(f){ toast(fehlerText(f)); });
}
function zahlungWeg(id,ma,mo){ frage('Zahlung löschen?','🗑 Löschen',function(){ rufe('zahlungLoeschen',{id:id, ma:ma, monat:mo}).then(mlZeigen).catch(function(f){ toast(fehlerText(f)); }); }); }
function mlDateien(ma,mo){
  var b=$('mlDat'); b.disabled=true; b.innerHTML='⏳ wird erstellt…';
  rufe('lohnlisteDateien',{ma:ma, monat:mo}).then(function(r){
    oeffneBlatt('<h2>✓ Gespeichert</h2><p>Beide Excel‑Dateien liegen in deinem Ordner <b>eleman › '+mo.slice(2,4)+'</b>.</p>'+
      '<a class="mittel b-navy" style="color:#fff;text-decoration:none" href="'+r.intern+'" target="_blank">Monatsliste öffnen</a><div style="height:8px"></div>'+
      '<a class="mittel b-hell" style="text-decoration:none" href="'+r.steuer+'" target="_blank">Steuerberater‑Tabelle öffnen</a><div style="height:8px"></div>'+
      '<a class="mittel b-hell" style="text-decoration:none" href="'+r.ordner+'" target="_blank">Ordner öffnen</a>');
  }).catch(function(f){ b.disabled=false; b.innerHTML='📁 Erneut versuchen'; toast(fehlerText(f)); });
}
function maSpeichern(id){
  var d={id:id, name:$('mName').value, sprache:$('mSpr').value, rolle:$('mRolle').value, pin:$('mPin').value.trim(), aktiv: id?$('mAktiv').checked:true,
         urlaubJahr:$('mUrlaub').value.trim(), urlaubStartGenommen:$('mUrlaubVorher').value.trim(),
         stundenlohn:$('mLohn').value.trim(), saldoMonat:$('mSMon').value, saldoStart:$('mSal').value.trim().replace('−','-')};
  rufe('mitarbeiterSpeichern',{mitarbeiter:d}).then(function(r){ schliesseBlatt(); nachAdmin(r); toast('✓ gespeichert'); }).catch(function(f){ fFehler(fehlerText(f)); });
}

/* ======================= Blatt (von unten) ======================= */
var _frageJa=null;
function frage(text, jaText, ja){ _frageJa=ja;
  oeffneBlatt('<h2 style="margin-bottom:18px">'+text+'</h2><button class="gross b-rot" onclick="var f=_frageJa;schliesseBlatt();f()">'+jaText+'</button><div style="height:8px"></div><button class="mittel b-hell" onclick="schliesseBlatt()">'+L('abbrechen')+'</button>'); }
function oeffneBlatt(html, form){
  var b=$('blatt'); b.innerHTML='<div class="griff"></div>'+html; b.scrollTop=0;
  $('schleier').classList.add('an'); b.classList.add('an');
  if(!form){ var y0=null; b.ontouchstart=function(e){ y0 = b.scrollTop<=0 ? e.touches[0].clientY : null; };
    b.ontouchend=function(e){ if(y0!==null && e.changedTouches[0].clientY-y0>90) schliesseBlatt(); y0=null; }; } else { b.ontouchstart=b.ontouchend=null; }
}
function schliesseBlatt(){ $('blatt').classList.remove('an'); $('schleier').classList.remove('an'); F=null; }
$('schleier').onclick=schliesseBlatt;

/* ======================= NACHRICHTEN ======================= */
var ARTEN={material:['📦','material'], vorfall:['⚠️','vorfall'], sonstiges:['💬','sonstiges']};
function zeigeNachrichten(){
  var h='<button class="gross b-navy" onclick="nachrichtForm()">✉️ '+L('neueNachricht')+'</button><div style="height:12px"></div>';
  h+='<div id="nliste"><div class="leer">…</div></div>';
  $('inhalt').innerHTML=h;
  ladeNachrichten();
}
function ladeNachrichten(){
  return rufe('meldungen',{}).then(function(d){ S.nachr=d.liste; S.ungelesen=d.ungelesen; if(S.ansicht==='nachrichten') listeNachrichten(); badgeAktualisieren(); })
    .catch(function(f){ var el=$('nliste'); if(el) el.innerHTML='<div class="leer">'+esc(fehlerText(f))+'</div>'; });
}
function badgeAktualisieren(){ var b=document.querySelector('nav.unten'); if(!b) return; var alt=S.ansicht; b.outerHTML='<nav class="unten">'+navKnopf('heute','🕒')+navKnopf('kalender','📅')+navKnopf('reise','🚗')+navKnopf('nachrichten','💬')+(S.nutzer.rolle==='admin'?navKnopf('verwaltung','⚙️'):'')+'</nav>'; }
function listeNachrichten(){
  var el=$('nliste'); if(!el) return; var l=S.nachr||[];
  if(!l.length){ el.innerHTML='<div class="leer">'+L('keineNachr')+'</div>'; return; }
  el.innerHTML=l.map(function(m){ var a=ARTEN[m.art]||ARTEN.sonstiges, neu=m.fuerMich&&!m.gelesen;
    var z=m.zeit? m.zeit.slice(8,10)+'.'+m.zeit.slice(5,7)+'. '+m.zeit.slice(11,16) : '';
    return '<div class="msg'+(neu?' neu':'')+'"><div class="kopfz"><span>'+a[0]+' <b>'+Lt(a[1])+'</b>'+(m.baustelleName?' · '+esc(m.baustelleName):'')+'</span><span>'+z+'</span></div>'+
      '<div class="t">'+esc(m.text).replace(/(https:\/\/drive\.google\.com\/file\/d\/[\w-]+\/view)/g,'<a class="link" href="$1" target="_blank">📷 Foto</a>')+'</div><div class="kopfz"><span>'+(m.fuerMich?(tr()?'Kimden: ':'Von: ')+esc(m.vonName):(tr()?'Kime: ':'An: ')+esc(m.anName))+'</span>'+
      (neu?'<button class="pill p-gruen" onclick="nachrichtGelesen(\''+m.id+'\')">✓ '+Lt('erledigt')+'</button>':(m.gelesen&&!m.fuerMich?'<span>✓✓ '+(tr()?'okundu / ':'')+'gelesen</span>':''))+'</div></div>'; }).join('');
}
function nachrichtGelesen(id){ rufe('meldungGelesen',{id:id}).then(function(d){ S.nachr=d.liste; S.ungelesen=d.ungelesen; listeNachrichten(); badgeAktualisieren(); }).catch(function(f){ toast(fehlerText(f)); }); }
var NF=null;
function nachrichtForm(art){
  NF=NF||{art:'material', baustelle:(S.laufend&&S.laufend.baustelle)||S.auswahlBs||'', an:'', text:''};
  if(art) NF.art=art;
  var admin=S.nutzer.rolle==='admin';
  var h='<h2>✉️ '+L('neueNachricht')+'</h2><div class="seg">'+Object.keys(ARTEN).map(function(k){ return '<button class="'+(NF.art===k?'an':'')+'" onclick="nfLesen();nachrichtForm(\''+k+'\')">'+ARTEN[k][0]+' '+L(ARTEN[k][1])+'</button>'; }).join('')+'</div>';
  if(admin) h+='<label class="f">An</label><select class="eing" id="nfAn">'+S.mitarbeiter.filter(function(m){return m.id!==S.nutzer.id&&m.aktiv;}).map(function(m){return '<option value="'+m.id+'" '+(NF.an===m.id?'selected':'')+'>'+esc(m.name)+'</option>';}).join('')+'</select>';
  else h+='<p class="klein" style="margin:10px 0 0">'+L('anChef')+' ✓</p>';
  h+='<label class="f">'+L('baustelle','inl')+'</label><select class="eing" id="nfBs"><option value="">–</option>'+S.baustellen.map(function(b){return '<option value="'+b.id+'" '+(NF.baustelle===b.id?'selected':'')+'>'+esc(b.name)+'</option>';}).join('')+'</select>';
  h+='<label class="f">'+L('nachrichtText','inl')+'</label><textarea class="eing" id="nfText" style="min-height:120px" placeholder="'+(NF.art==='material'?(tr()?'örn. 50 m NYM 3x1,5 · 10 priz kutusu / ':'')+'z. B. 50 m NYM 3x1,5 · 10 Schalterdosen':'')+'">'+esc(NF.text)+'</textarea>';
  h+='<div class="belege" id="nfFotos">'+(NF.fotos||[]).map(function(f,i){ return '<span>📷 '+(i+1)+' ✓</span>'; }).join('')+'</div>'+
     '<button class="mittel b-hell" id="nfFotoB" onclick="nfFoto()">📷 '+L('foto')+'</button>';
  h+='<div id="fFehler"></div><div style="height:14px"></div><button class="gross b-gruen" onclick="nachrichtSenden()">📨 '+L('senden')+'</button><div style="height:8px"></div><button class="mittel b-hell" onclick="schliesseBlatt()">'+L('abbrechen')+'</button>';
  oeffneBlatt(h,true);
}
function nfLesen(){ if(!NF) return; var a=$('nfAn'),b=$('nfBs'),t=$('nfText'); if(a) NF.an=a.value; if(b) NF.baustelle=b.value; if(t) NF.text=t.value; }
function nfFoto(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(!f) return; nfLesen(); var b=$('nfFotoB'); if(b) b.innerHTML='⏳ …';
    bildKlein(f,1600).then(function(b64){ return rufeRoh('meldungFoto',{daten:b64, mime:'image/jpeg', baustelle:NF.baustelle}); })
      .then(function(r){ NF.fotos=(NF.fotos||[]).concat([r.id]); nachrichtForm(); })
      .catch(function(e){ toast(fehlerText(e)); nachrichtForm(); }); };
  inp.click();
}
function nachrichtSenden(){
  nfLesen(); if(!NF.text.trim() && !(NF.fotos||[]).length) return fFehler(Lt('nachrichtText')+' ?');
  var text=NF.text+((NF.fotos||[]).length?'\n'+NF.fotos.map(function(id){ return 'https://drive.google.com/file/d/'+id+'/view'; }).join('\n'):'');
  rufe('meldungSenden',{art:NF.art, baustelle:NF.baustelle, an:NF.an, text:text}).then(function(d){ NF=null; S.nachr=d.liste; schliesseBlatt(); toast('📨 '+(tr()?'Gönderildi / ':'')+'Gesendet'); if(S.ansicht!=='nachrichten') gehe('nachrichten'); else listeNachrichten(); })
    .catch(function(f){ fFehler(fehlerText(f)); });
}
function pushKarte(){
  var el=$('pushKarte'); if(!el) return;
  if(LS.getItem('ze_push_ok')){ el.innerHTML='<p class="klein" style="text-align:center;margin:0 0 10px">🔔 '+(tr()?'Bildirimler açık / ':'')+'Benachrichtigungen eingerichtet · <a class="link" href="#" onclick="LS.removeItem(\'ze_push_ok\');pushKarte();return false">'+(tr()?'tekrar / ':'')+'neu einrichten</a></p>'; return; }
  el.innerHTML='<div class="karte" style="border:2px dashed var(--blau)"><p class="titel">🔔 '+(tr()?'Telefona bildirim<br><small style="font-weight:400">':'')+'Meldungen aufs Handy'+(tr()?'</small>':'')+'</p><div id="pushInhalt" class="leer">…</div></div>';
  rufe('benachrichtigung',{}).then(function(d){
    var android=/Android/i.test(navigator.userAgent), ios=/iPhone|iPad/i.test(navigator.userAgent);
    var store = ios ? 'https://apps.apple.com/app/ntfy/id1625396347' : 'https://play.google.com/store/apps/details?id=io.heckel.ntfy';
    var abo = (android||ios) ? 'ntfy://'+d.server+'/'+d.thema : 'https://'+d.server+'/'+d.thema;
    $('pushInhalt').className=''; $('pushInhalt').innerHTML=
      '<p class="klein" style="text-align:left">'+(tr()?'1) Ücretsiz <b>ntfy</b> uygulamasını yükleyin. 2) „Abone ol“a dokunun. 3) Onaylayın.<br>':'')+'1) Kostenlose App <b>ntfy</b> installieren (ohne Konto). 2) Auf „Abonnieren“ tippen. 3) In ntfy bestätigen.</p>'+
      '<div class="reihe"><a class="mittel b-hell" style="text-decoration:none" href="'+store+'" target="_blank">⬇️ ntfy</a><a class="mittel b-blau" style="color:#fff;text-decoration:none" href="'+abo+'">🔔 '+(tr()?'Abone ol / ':'')+'Abonnieren</a></div>'+
      '<p class="klein" style="text-align:left;margin-top:10px">'+(tr()?'Olmazsa: ntfy uygulamasında <b>+</b> → bu konuyu girin → <b>Subscribe</b><br>':'')+'Falls das nicht klappt: in der ntfy-App auf <b>+</b> tippen, dieses Thema einfügen, <b>Subscribe</b>:</p>'+
      '<div style="display:flex;gap:6px;align-items:center"><code id="ntfyThema" style="user-select:all;flex:1;background:#eef1f4;padding:10px;border-radius:10px;font-size:.85rem;word-break:break-all">'+esc(d.thema)+'</code>'+
      '<button class="pill p-blau" onclick="themaKopieren()">📋 '+(tr()?'Kopyala':'Kopieren')+'</button></div>'+
      '<div style="height:10px"></div><div class="reihe"><button class="mittel b-hell" onclick="pushTest()">🧪 '+(tr()?'Test / ':'')+'Test-Meldung</button><button class="mittel b-gruen" style="color:#fff" onclick="LS.setItem(\'ze_push_ok\',\'1\');pushKarte()">✓ '+(tr()?'Tamam / ':'')+'Klappt</button></div>';
  }).catch(function(f){ var p=$('pushInhalt'); if(p) p.textContent=fehlerText(f); });
}
function themaKopieren(){ var t=$('ntfyThema').textContent; try{ navigator.clipboard.writeText(t).then(function(){ toast('📋 '+(tr()?'Kopyalandı / ':'')+'Kopiert'); }, function(){ toast(t); }); }catch(e){ toast(t); } }
function pushTest(){ rufe('pushTest',{}).then(function(){ toast('🧪 '+(tr()?'Gönderildi – telefona bakın / ':'')+'Gesendet – aufs Handy schauen'); }).catch(function(f){ toast(fehlerText(f)); }); }
// Neue Nachrichten regelmäßig prüfen, solange die App offen ist
setInterval(function(){ if(S.token&&S.nutzer&&!document.hidden) rufe('meldungen',{}).then(function(d){ var vorher=S.ungelesen||0; S.nachr=d.liste; S.ungelesen=d.ungelesen; if(S.ansicht==='nachrichten') listeNachrichten(); if(d.ungelesen!==vorher) badgeAktualisieren(); }).catch(function(){}); }, 60000);
if(location.hash==='#nachrichten'){ S.ansicht='nachrichten'; try{ history.replaceState(null,'',location.pathname); }catch(e){} }

init();
</script>
