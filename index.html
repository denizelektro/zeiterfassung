function jetztZeit(){ var d=new Date(); return zwei(d.getHours())+':'+zwei(d.getMinutes()); }
function heuteIso(){ return isoD(new Date()); }
function minDiff(a,b){ var x=a.split(':'),y=b.split(':'); return (+y[0]*60+ +y[1])-(+x[0]*60+ +x[1]); }
function std(e){ if(e.typ!=='A'||!e.start||!e.ende) return 0; return Math.max(0,minDiff(e.start,e.ende)-(+e.pause||0))/60; }
function fStd(h){ var r=Math.round(h*100)/100; return String(r).replace('.',','); }
function dObj(iso){ return new Date(iso+'T12:00:00'); }
function monatVon(iso){ return iso.slice(0,7); }
function monatPlus(m,n){ var d=new Date(+m.slice(0,4), +m.slice(5,7)-1+n, 1); return d.getFullYear()+'-'+zwei(d.getMonth()+1); }
function datumText(iso){ var d=dObj(iso); return tr()
  ? '<span class="zw"><b>'+TR_TAGE[d.getDay()]+', '+d.getDate()+' '+TR_MON[d.getMonth()]+'</b><span class="de">'+DE_TAGE[d.getDay()]+', '+d.getDate()+'. '+DE_MON[d.getMonth()]+'</span></span>'
  : DE_TAGE[d.getDay()]+', '+d.getDate()+'. '+DE_MON[d.getMonth()]+' '+d.getFullYear(); }
function monatText(m){ var i=+m.slice(5,7)-1, j=m.slice(0,4); return tr() ? '<span class="zw"><b>'+TR_MON[i]+' '+j+'</b><span class="de">'+DE_MON[i]+'</span></span>' : DE_MON[i]+' '+j; }
function feiertag(iso){
  var j=+iso.slice(0,4), fest={'01-01':'Neujahr','05-01':'Tag der Arbeit','10-03':'Tag der Dt. Einheit','11-01':'Allerheiligen','12-25':'1. Weihnachtstag','12-26':'2. Weihnachtstag'};
  if(fest[iso.slice(5)]) return fest[iso.slice(5)];
  var a=j%19,b=Math.floor(j/100),c=j%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mon=Math.floor((h+l-7*m+114)/31),tag=((h+l-7*m+114)%31)+1;
  var o=new Date(j,mon-1,tag,12), bew={'-2':'Karfreitag','1':'Ostermontag','39':'Christi Himmelfahrt','50':'Pfingstmontag','60':'Fronleichnam'};
  for(var x in bew){ var t=new Date(o); t.setDate(t.getDate()+(+x)); if(isoD(t)===iso) return bew[x]; }
  return '';
}
function uuid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); }

/* ======================= Server-Aufrufe (mit Offline-Warteschlange) ======================= */
var _beschaeftigt=0;
function beschaeftigt(n){ _beschaeftigt=Math.max(0,_beschaeftigt+n); document.body.classList.toggle('busy', _beschaeftigt>0); }
function rufe(aktion, daten){
  var schreibend=['monat','start','uebersicht'].indexOf(aktion)<0;   // Doppel-Tippen beim Speichern verhindern
  if(schreibend) beschaeftigt(1);
  var p = rufeRoh(aktion, daten);
  if(schreibend) p.then(function(){ beschaeftigt(-1); }, function(){ beschaeftigt(-1); });
  return p;
}
function rufeRoh(aktion, daten){
  return new Promise(function(ok, nein){
    google.script.run.withSuccessHandler(function(r){
      if(!r.ok){ if(r.fehler==='ANMELDUNG'){ abmeldenLokal(); return nein({anmeldung:true}); } return nein({fehler:r.fehler}); }
      ok(r.daten);
    }).withFailureHandler(function(e){ nein({netz:true, e:e}); }).api(S.token, aktion, daten);
  });
}
function schlange(){ try{ return JSON.parse(LS.getItem('ze_schlange')||'[]'); }catch(e){ return []; } }
function setzeSchlange(q){ LS.setItem('ze_schlange', JSON.stringify(q)); zeigeOffline(); }
function zeigeOffline(){ var n=schlange().length, el=$('offline'); if(!n){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden'); el.textContent = (tr()?'İnternet yok – '+n+' kayıt sonra gönderilecek · ':'')+'Offline – '+n+' Buchung(en) werden später gesendet'; }
/** Buchung senden; bei fehlendem Netz merken und lokal anzeigen. */
function buchen(aktion, daten){
  if(schlange().length){ var q=schlange(); q.push({a:aktion,d:daten}); setzeSchlange(q); lokalAnwenden(aktion,daten); render(); return Promise.resolve(); }
  return rufe(aktion, daten).then(function(m){ monatSetzen(m); render(); }).catch(function(f){
    if(f.netz){ var q=schlange(); q.push({a:aktion,d:daten}); setzeSchlange(q); lokalAnwenden(aktion,daten); render(); return; }
    throw f;
  });
}
var sendetGerade=false;
function schlangeSenden(){
  var q=schlange(); if(!q.length||sendetGerade||!S.token) return;
  sendetGerade=true;
  rufe(q[0].a, q[0].d).then(function(m){ q.shift(); setzeSchlange(q); monatSetzen(m); sendetGerade=false; if(q.length) schlangeSenden(); else { toast(Lt('speichern')+' ✓'); render(); } })
  .catch(function(f){ sendetGerade=false; if(!f.netz){ q.shift(); setzeSchlange(q); toast(fehlerText(f)); render(); } });
}
setInterval(schlangeSenden, 20000);
window.addEventListener('online', schlangeSenden);
document.addEventListener('visibilitychange', function(){ if(!document.hidden){ schlangeSenden(); } });

function schl(ma,m){ return ma+'|'+m; }
function monatSetzen(m){ if(S.jahre) delete S.jahre[m.ma+'|'+m.monat.slice(0,4)]; S.monate[schl(m.ma,m.monat)] = m; if(m.ma===S.nutzer.id) S.laufend = m.laufend; lokalSichern(); }
function lokalSichern(){ try{ if(!S.nutzer) return; var mc={}, k=schl(S.nutzer.id, monatVon(heuteIso())); if(S.monate[k]) mc[k]=S.monate[k];
  LS.setItem('ze_monate', JSON.stringify(mc)); LS.setItem('ze_laufend', JSON.stringify(S.laufend||null)); }catch(e){} }
function monatDaten(ma,m){ return S.monate[schl(ma,m)]; }
function ladeMonat(ma,m){ return rufe('monat',{ma:ma,monat:m}).then(function(d){ monatSetzen(d); return d; }); }

function lokalAnwenden(aktion, d){
  var m = monatDaten(S.nutzer.id, monatVon(d.datum || (d.eintrag&&d.eintrag.datum) || heuteIso()));
  if(!m){ m={ma:S.nutzer.id,monat:monatVon(d.datum||d.eintrag.datum),eintraege:[],abgeschlossen:[],gesperrt:false}; monatSetzen(m); }
  if(aktion==='stempeln'){
    var l=S.laufend;
    var find=function(id){ return m.eintraege.filter(function(e){return e.id===id;})[0]; };
    var beenden=function(){ var e=find(l.id); var p=l.pause+(l.pauseStart?Math.max(0,minDiff(l.pauseStart,d.zeit)):0); if(e){ e.ende=d.zeit; e.pause=p; e.pauseStart=''; } S.laufend=null; };
    if(d.art==='beginn'||d.art==='wechsel'){ if(l&&d.art==='wechsel') beenden(); var n={id:d.id,ma:S.nutzer.id,datum:d.datum,typ:'A',baustelle:d.baustelle,start:d.zeit,ende:'',pause:0,pauseStart:'',taetigkeit:'',material:[],km:''}; m.eintraege.push(n); S.laufend=JSON.parse(JSON.stringify(n)); }
    else if(l){ var e=find(l.id)||{};
      if(d.art==='pause'){ l.pauseStart=e.pauseStart=d.zeit; }
      if(d.art==='weiter'&&l.pauseStart){ l.pause+=Math.max(0,minDiff(l.pauseStart,d.zeit)); e.pause=l.pause; l.pauseStart=e.pauseStart=''; }
      if(d.art==='ende') beenden(); }
  }
  if(aktion==='eintragSpeichern'){ var x=d.eintrag; m.eintraege=m.eintraege.filter(function(e){return e.id!==x.id;}); m.eintraege.push(x); }
  lokalSichern();
}

function fehlerText(f){ if(!f) return '?'; if(f.netz) return (tr()?'İnternet yok / ':'')+'Keine Verbindung'; var k=f.fehler||''; return FEHLER[k] ? Lt(k) : k; }
function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('an'); clearTimeout(toast.t); toast.t=setTimeout(function(){ el.classList.remove('an'); }, 2600); }

/* ======================= Start ======================= */
function init(){
  S.token = LS.getItem('ze_token');
  if(!S.token){ zeigeLogin(); return; }
  // Sofort mit den zuletzt bekannten Daten starten, dann im Hintergrund aktualisieren
  var cache=null; try{ cache=JSON.parse(LS.getItem('ze_start')||'null'); }catch(e){}
  if(cache){ try{ startSetzen(cache); var mc=JSON.parse(LS.getItem('ze_monate')||'{}'); for(var k in mc) S.monate[k]=mc[k];
    S.laufend=JSON.parse(LS.getItem('ze_laufend')||'null'); render(); }catch(e){ cache=null; } }
  var mo=monatVon(heuteIso());
  rufe('start',{monat:mo}).then(function(d){ startSetzen(d); if(d.monatDaten) monatSetzen(d.monatDaten); else return ladeMonat(S.nutzer.id,mo); })
    .then(function(){ if(!$('blatt').classList.contains('an')) render(); else zeigeOffline(); schlangeSenden(); })
    .catch(function(f){ if(f.anmeldung) return;
      if(cache){ toast(f.netz ? (tr()?'İnternet yok – kayıtlar sonra gönderilir · ':'')+'Offline – Buchungen werden später gesendet' : fehlerText(f)); return; }
      $('app').innerHTML='<div class="lade" style="flex-direction:column;gap:14px;padding:20px;text-align:center">'+esc(fehlerText(f))+'<button class="mittel b-navy" style="color:#fff;max-width:240px" onclick="location.reload()">Neu laden</button></div>'; });
}
function startSetzen(d){
  if(d.ungelesen!==undefined) S.ungelesen=d.ungelesen;
  try{ LS.setItem('ze_start', JSON.stringify(d)); LS.setItem('ze_sprache', d.nutzer.sprache||'de'); }catch(e){}
  S.nutzer=d.nutzer; S.baustellen=d.baustellen; S.mitarbeiter=d.mitarbeiter||[]; S.alleBaustellen=d.alleBaustellen||[];
  S.ma = S.ma || S.nutzer.id; S.kalMonat = S.kalMonat || monatVon(heuteIso()); S.adminMonat = S.adminMonat || monatVon(heuteIso());
  document.documentElement.lang = tr() ? 'tr' : 'de';
}
function abmeldenLokal(){ ['ze_token','ze_start','ze_monate','ze_laufend'].forEach(function(k){ LS.removeItem(k); }); S.token=null; S.nutzer=null; S.monate={}; zeigeLogin(); }

/* ======================= Login ======================= */
var pinEingabe='';
function zeigeLogin(){
  pinEingabe=''; schliesseBlatt();
  var nurDe = LS.getItem('ze_sprache')==='de';   // Sprache merkt sich das Gerät nach der ersten Anmeldung
  $('app').innerHTML = '<div class="login"><div style="font-size:min(42px,5vh)">⚡</div><h1>Zeiterfassung</h1><div style="opacity:.85;text-align:center">'+(nurDe?'<b>PIN eingeben</b>':'<b>PIN girin</b><br><small>PIN eingeben</small>')+'</div>'+
    '<div class="punkte" id="punkte"></div><div class="tasten">'+[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(function(z){
      return z===''?'<span></span>':'<button onclick="pinTaste(\''+z+'\')">'+z+'</button>'; }).join('')+'</div>'+
    '<button id="pinOk" class="mittel" style="margin-top:min(22px,2.5vh);max-width:260px;background:#fff;color:var(--navy)" onclick="pinSenden()">'+(nurDe?'<b>Anmelden</b>':'<b>Giriş</b>&nbsp;/ Anmelden')+'</button>'+
    '<div id="pinFehler" style="margin-top:14px;min-height:22px;color:#ffd2cc;text-align:center"></div></div>';
  pinPunkte();
}
function pinTaste(z){ if(z==='⌫') pinEingabe=pinEingabe.slice(0,-1); else if(pinEingabe.length<8) pinEingabe+=z; pinPunkte(); $('pinFehler').textContent=''; }
function pinPunkte(){ var n=Math.max(4,pinEingabe.length); var h=''; for(var i=0;i<n;i++) h+='<span class="'+(i<pinEingabe.length?'voll':'')+'"></span>'; $('punkte').innerHTML=h; }
function pinSenden(){
  if(pinEingabe.length<4) return;
  var knopf=$('pinOk'), vorher=knopf.innerHTML; knopf.disabled=true; knopf.innerHTML='⏳ …';
  var nurDe = LS.getItem('ze_sprache')==='de';
  google.script.run.withSuccessHandler(function(r){
    knopf.disabled=false; knopf.innerHTML=vorher;
    if(!r.ok){ pinEingabe=''; pinPunkte(); var t=FEHLER[r.fehler]||[r.fehler,r.fehler]; $('pinFehler').innerHTML=nurDe?'<b>'+t[1]+'</b>':'<b>'+t[0]+'</b><br>'+t[1]; return; }
    var d=r.daten; S.token=d.token; LS.setItem('ze_token',S.token); S.ansicht='heute';
    if(d.start){ startSetzen(d.start); if(d.monat) monatSetzen(d.monat); render(); schlangeSenden(); } else init();
  }).withFailureHandler(function(){ knopf.disabled=false; knopf.innerHTML=vorher; $('pinFehler').innerHTML=nurDe?'<b>Keine Verbindung</b>':'<b>İnternet yok</b><br>Keine Verbindung'; }).api(null,'login',{pin:pinEingabe});
}

/* ======================= Rahmen ======================= */
function render(){
  if(!S.nutzer) return;
  zeigeOffline();
  var admin = S.nutzer.rolle==='admin';
  var kopfTitel = S.ansicht==='heute' ? L('heute') : S.ansicht==='kalender' ? L('kalender') : S.ansicht==='nachrichten' ? L('nachrichten') : 'Verwaltung';
  var html = '<header class="kopf"><div class="zeile"><h1>'+kopfTitel+'</h1><button class="ikon" onclick="menue()" aria-label="Menü">☰</button></div>'+
    '<div class="sub">'+esc(S.nutzer.name)+'</div></header><main id="inhalt"></main>'+
    '<nav class="unten">'+navKnopf('heute','🕒')+navKnopf('kalender','📅')+navKnopf('nachrichten','💬')+(admin?navKnopf('verwaltung','⚙️'):'')+'</nav>';
  $('app').innerHTML = html;
  if(S.ansicht==='heute') zeigeHeute(); else if(S.ansicht==='kalender') zeigeKalender(); else if(S.ansicht==='nachrichten') zeigeNachrichten(); else zeigeVerwaltung();
}
function navKnopf(id, ikon){ return '<button class="'+(S.ansicht===id?'an':'')+'" onclick="gehe(\''+id+'\')"><span class="i">'+ikon+(id==='nachrichten'&&S.ungelesen?'<span class="badge">'+S.ungelesen+'</span>':'')+'</span>'+(id==='verwaltung'?'<span>Verwaltung</span>':L(id))+'</button>'; }
function gehe(id){ S.ansicht=id; if(id==='kalender'){ S.kalMonat = S.kalMonat||monatVon(heuteIso()); } render(); window.scrollTo(0,0); }
function menue(){
  oeffneBlatt('<h2>'+esc(S.nutzer.name)+'</h2>'+
    '<button class="mittel b-hell" onclick="location.reload()">↻ '+(tr()?'<b>Yenile</b>&nbsp;/ Neu laden':'Neu laden')+'</button><div style="height:10px"></div>'+
    '<button class="mittel b-rot" style="color:#fff" onclick="abmelden()">'+L('abmelden')+'</button>');
}
function abmelden(){ rufe('abmelden',{}).catch(function(){}).then(abmeldenLokal); }

/* ======================= HEUTE ======================= */
function bsAdresse(id){ var b=(S.alleBaustellen.length?S.alleBaustellen:S.baustellen).filter(function(x){return x.id===id;})[0]; return b?b.adresse:''; }
function bsName(id){ var b=(S.alleBaustellen.length?S.alleBaustellen:S.baustellen).filter(function(x){return x.id===id;})[0] || S.baustellen.filter(function(x){return x.id===id;})[0]; return b?b.name:'—'; }
function zeigeHeute(){
  var heute=heuteIso(), m=monatDaten(S.nutzer.id, monatVon(heute)) || {eintraege:[],abgeschlossen:[]};
  var l=S.laufend, h='';
  h+='<div class="karte" style="padding-bottom:6px"><div style="font-size:1.1rem">'+datumText(heute)+'</div></div>';
  if(m.gesperrt) h+='<div class="hinweis">'+Lt('gesperrt')+'</div>';
  h+='<div class="karte" id="stempel">';
  if(!l){
    h+='<p class="titel">'+L('bsWaehlen')+'</p>'+bsListe('waehleBs');
    h+='<button class="gross b-gruen" onclick="stempel(\'beginn\')">▶ '+L('beginnen')+'</button>';
  } else {
    var inPause=!!l.pauseStart;
    h+='<div class="laeuft"><span class="pill '+(inPause?'p-gelb':'p-gruen')+'">'+(inPause?'❚❚ '+Lt('inPause'):'● '+Lt('laeuftSeit')+' '+l.start)+'</span>'+
       '<div class="uhr" id="uhr">'+laufzeit(l)+'</div><div style="font-weight:700">'+esc(bsName(l.baustelle))+'</div>'+
       (bsAdresse(l.baustelle)?'<button class="navi-gross" onclick="navi(\''+l.baustelle+'\')">📍 '+Lt('navi')+'</button>':'')+
       (l.datum!==heute?'<div class="klein">'+esc(l.datum)+'</div>':'')+'</div>';
    h+='<div class="reihe" style="margin-bottom:10px">'+(inPause
        ? '<button class="mittel b-gruen" style="color:#fff" onclick="stempel(\'weiter\')">▶ '+L('weiter')+'</button>'
        : '<button class="mittel b-gelb" style="color:#fff" onclick="stempel(\'pause\')">❚❚ '+L('pause')+'</button>')+
       '<button class="mittel b-hell" onclick="wechselDialog()">⇄ '+L('bsWechseln')+'</button></div>';
    h+='<button class="gross b-rot" onclick="stempel(\'ende\')">■ '+L('feierabend')+'</button>';
  }
  h+='</div>';
  var heuteE = m.eintraege.filter(function(e){ return e.datum===heute; });
  h+='<div class="karte"><p class="titel">'+L('heuteGearbeitet')+'</p>'+eintragsListe(heuteE, heute, m)+'</div>';
  $('inhalt').innerHTML=h;
  clearInterval(S.uhrTimer);
  if(l) S.uhrTimer=setInterval(function(){ var u=$('uhr'); if(u) u.textContent=laufzeit(S.laufend||l); }, 15000);
  wischen($('inhalt'), function(r){ if(r<0) gehe('kalender'); });
}
function laufzeit(l){ if(!l) return ''; var j=jetztZeit(), sameDay=l.datum===heuteIso(); var min = sameDay ? minDiff(l.start, l.pauseStart||j) - l.pause : 0; min=Math.max(0,min); return Math.floor(min/60)+':'+zwei(min%60); }
function bsListe(fn){
  if(!S.baustellen.length) return '<div class="leer">'+(tr()?'Henüz şantiye yok<br>':'')+'Noch keine Baustelle angelegt</div>';
  if(!S.auswahlBs || !S.baustellen.some(function(b){return b.id===S.auswahlBs;})) S.auswahlBs = LS.getItem('ze_letzteBs') && S.baustellen.some(function(b){return b.id===LS.getItem('ze_letzteBs');}) ? LS.getItem('ze_letzteBs') : (S.baustellen.length===1?S.baustellen[0].id:null);
  return '<div class="bs-liste">'+S.baustellen.map(function(b){ return '<div class="bs-zeile"><button class="bs '+(S.auswahlBs===b.id?'an':'')+'" onclick="'+fn+'(\''+b.id+'\')"><span class="punkt"></span><span><b>'+esc(b.name)+'</b>'+(b.adresse?'<small>'+esc(b.adresse)+'</small>':'')+'</span></button>'+
    (b.adresse?'<button class="navi" onclick="navi(\''+b.id+'\')"><span class="p">📍</span>'+(tr()?'Yol tarifi':'Navi')+'</button>':'')+'</div>'; }).join('')+'</div>';
}
/** Navigation zur Baustelle: Android = Standard-Karten-App, iPhone = Auswahl, PC = Google Maps */
function navi(id){
  var b=(S.alleBaustellen.length?S.alleBaustellen:S.baustellen).filter(function(x){return x.id===id;})[0] || S.baustellen.filter(function(x){return x.id===id;})[0];
  if(!b||!b.adresse){ toast((tr()?'Adres yok / ':'')+'Keine Adresse hinterlegt'); return; }
  var q=encodeURIComponent(b.adresse), ua=navigator.userAgent||'';
  var gmaps='https://www.google.com/maps/dir/?api=1&destination='+q;
  if(/Android/i.test(ua)){ location.href='geo:0,0?q='+q; return; }
  if(/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints>1)){
    oeffneBlatt('<h2>📍 '+esc(b.name)+'</h2><p class="klein">'+esc(b.adresse)+'</p>'+
      '<a class="mittel b-navy" style="color:#fff;text-decoration:none" href="maps://?daddr='+q+'">'+(tr()?'<b>Apple Haritalar</b>&nbsp;/ ':'')+'Apple Karten</a><div style="height:8px"></div>'+
      '<a class="mittel b-hell" style="text-decoration:none" href="'+gmaps+'">Google Maps</a><div style="height:8px"></div>'+
      '<button class="mittel b-hell" onclick="schliesseBlatt()">'+L('abbrechen')+'</button>'); return; }
  window.open(gmaps,'_blank');
}
function waehleBs(id){ S.auswahlBs=id; LS.setItem('ze_letzteBs',id); zeigeHeute(); }
function stempel(art, bs){
  var d={art:art, zeit:jetztZeit(), datum:(S.laufend&&art!=='beginn'&&art!=='wechsel')?S.laufend.datum:heuteIso()};
  if(art==='beginn'||art==='wechsel'){ d.baustelle = bs||S.auswahlBs; if(!d.baustelle){ toast(Lt('BAUSTELLE_FEHLT')); return; } d.id=uuid(); d.datum=heuteIso(); }
  var endeId = art==='ende' && S.laufend ? S.laufend.id : null;
  buchen('stempeln', d).then(function(){
    if(art==='ende' && endeId){ var e=findeEintrag(endeId); if(e) oeffneBlatt('<h2>✓ '+L('feierabend')+'</h2><p>'+(tr()?'<b>Malzeme veya kilometre eklemek ister misiniz?</b><br><span class="klein">Möchtest du Material oder Kilometer ergänzen?</span>':'Material oder Kilometer ergänzen?')+'</p>'+
      '<button class="mittel b-navy" style="color:#fff" onclick="eintragForm(\''+endeId+'\')">'+L('nachher')+'</button><div style="height:8px"></div><button class="mittel b-hell" onclick="schliesseBlatt()">'+L('nichtJetzt')+'</button>'); }
  }).catch(function(f){ toast(fehlerText(f)); });
}
function wechselDialog(){
  var vorher=S.auswahlBs;
  oeffneBlatt('<h2>'+L('bsWechseln')+'</h2><div id="wbs">'+bsListe('wechselWahl')+'</div><button class="gross b-navy" onclick="schliesseBlatt();stempel(\'wechsel\')">⇄ '+L('bsWechseln')+'</button>');

function findeEintrag(id){ for(var k in S.monate){ var e=S.monate[k].eintraege.filter(function(x){return x.id===id;})[0]; if(e) return e; } return null; }

function eintragsListe(liste, datum, m){
  var h='';

  if(!liste.length) h+='<div class="leer">'+L('kein')+'</div>';

    var darf = !m.gesperrt || S.nutzer.rolle==='admin';
    if(e.typ!=='A'){ h+='<button class="eintrag" '+(darf?'onclick="eintragForm(\''+e.id+'\')"':'')+'><span class="pill '+(e.typ==='U'?'p-blau':'p-rot')+'">'+(e.typ==='U'?'🏖 '+Lt('urlaub'):'🤒 '+Lt('krank'))+'</span></button>'; return; }
    var laeuft=!e.ende;
    h+='<button class="eintrag" '+(darf?'onclick="eintragForm(\''+e.id+'\')"':'')+'><div class="k"><span class="bsn">'+esc(bsName(e.baustelle))+'</span><span class="std">'+(laeuft?'<span class="pill p-gelb">● '+e.start+'</span>':fStd(std(e))+' '+Lt('stdKurz').split(' / ').pop())+'</span></div>'+
      '<div class="info">'+e.start+' – '+(e.ende||'…')+(e.pause?' · '+Lt('pauseBisher').split(' / ').pop()+' '+e.pause+' Min.':'')+(e.km!==''&&e.km!=null&&+e.km>0?' · '+e.km+' km':'')+'</div>'+
      (e.taetigkeit?'<div class="taet">'+esc(e.taetigkeit)+'</div>':'')+
      (e.material&&e.material.length?'<ul>'+e.material.map(function(x){return '<li>'+esc((x.menge?x.menge+' ':'')+(x.einheit?x.einheit+' ':'')+x.text)+'</li>';}).join('')+'</ul>':'')+'</button>';
  });
  var summe = liste.reduce(function(s,e){return s+std(e);},0);
  var pw = pausenWarnung(liste); if(pw) h+='<div class="hinweis">⚠ '+pw+'</div>';
  if(summe>0) h+='<div style="text-align:right;font-weight:800;color:var(--navy);margin:4px 2px 10px">Σ '+fStd(summe)+' '+(tr()?'saat / ':'')+'Std.</div>';
  var zu = m.abgeschlossen && m.abgeschlossen.indexOf(datum)>=0;
  var hatArbeit = liste.some(function(e){return e.typ==='A';});
  var darf = !m.gesperrt || S.nutzer.rolle==='admin';
  if(darf){
    h+='<button class="mittel b-hell" onclick="eintragForm(null,\''+datum+'\')">＋ '+L('manuell')+'</button>';
    if(hatArbeit){ h+='<div style="height:8px"></div>'+(zu
      ? '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span class="pill p-gruen" style="padding:10px 12px">✓ '+Lt('tagZu')+'</span><button class="klein" style="text-decoration:underline" onclick="tagStatus(\''+datum+'\',false)">'+Lt('tagOeffnen')+'</button></div>'
      : '<button class="mittel b-navy" style="color:#fff" onclick="tagStatus(\''+datum+'\',true)">✓ '+L('tagSchliessen')+'</button>'); }
  }
  return h;
}
/** Arbeitszeitgesetz: >6 Std. → 30 Min. Pause, >9 Std. → 45 Min. */
function pausenWarnung(liste){
  var a=liste.filter(function(e){return e.typ==='A'&&e.ende;}); if(!a.length) return '';
  var h=a.reduce(function(s,e){return s+std(e);},0), p=a.reduce(function(s,e){return s+(+e.pause||0);},0), soll = h>9?45:(h>6?30:0);
  if(p>=soll) return '';
  return tr() ? '<b>Mola eksik: '+p+' dk, en az '+soll+' dk gerekli</b><br>Zu wenig Pause: '+p+' Min., mindestens '+soll+' Min. nötig'
              : 'Zu wenig Pause: '+p+' Min. gebucht, bei '+fStd(h)+' Std. Arbeit mindestens '+soll+' Min. nötig';
}
function tagStatus(datum, zu){

  rufe(zu?'tagAbschliessen':'tagOeffnen',{ma:ma, datum:datum}).then(function(m){ monatSetzen(m); toast(zu?'✓ '+Lt('tagZu'):Lt('tagOeffnen')); if($('blatt').classList.contains('an')&&S.ansicht==='kalender') tagDetail(datum); render(); })
   .catch(function(f){ toast(fehlerText(f)); });
}

/* ======================= KALENDER ======================= */
function zeigeKalender(){
  var mo=S.kalMonat, ma=S.ma||S.nutzer.id, d=monatDaten(ma,mo), h='';
  if(S.nutzer.rolle==='admin' && S.mitarbeiter.length>1){
    h+='<select class="eing sel-ma" onchange="S.ma=this.value;zeigeKalender()">'+S.mitarbeiter.map(function(x){return '<option value="'+x.id+'" '+(x.id===ma?'selected':'')+'>'+esc(x.name)+'</option>';}).join('')+'</select>';
  }
  var fl=S.kalFilter||'';
  h+='<div class="filter">'+[['','f-alle',tr()?'Hepsi<br><small>Alle</small>':'Alle'],['U','f-U','🏖 '+(tr()?'İzin':'Urlaub')],['K','f-K','🤒 '+(tr()?'Hasta':'Krank')]].map(function(f){
    return '<button class="'+f[1]+(fl===f[0]?' an':'')+'" onclick="S.kalFilter=\''+f[0]+'\';zeigeKalender()">'+f[2]+'</button>'; }).join('')+'</div>';
  h+='<div class="kal-kopf"><button class="pfeil" onclick="kalBlaettern(-1)">‹</button><div class="mon">'+monatText(mo)+'</div><button class="pfeil" onclick="kalBlaettern(1)">›</button></div>';
  if(!d){ $('inhalt').innerHTML=h+'<div class="lade" style="min-height:200px">…</div>'; ladeMonat(ma,mo).then(function(){ if(S.ansicht==='kalender'&&S.kalMonat===mo) zeigeKalender(); }).catch(function(f){ toast(fehlerText(f)); }); return; }
  h+='<div class="kal-wrap" id="kalwrap"><div class="kal" id="kal">';
  (tr()?TR_KURZ:DE_KURZ).forEach(function(w,i){ h+='<div class="wt">'+w+(tr()?'<br><span style="font-weight:400;opacity:.7">'+DE_KURZ[i]+'</span>':'')+'</div>'; });
  var j=+mo.slice(0,4), m=+mo.slice(5,7), erster=new Date(j,m-1,1), versatz=(erster.getDay()+6)%7, tage=new Date(j,m,0).getDate(), heute=heuteIso();
  for(var i=0;i<versatz;i++) h+='<div class="tag leerfeld"></div>';
  var lauf = ma===S.nutzer.id ? S.laufend : (d.laufend||null);
  for(var t=1;t<=tage;t++){
    var iso=mo+'-'+zwei(t), dt=new Date(j,m-1,t), we=dt.getDay()===0||dt.getDay()===6, ft=feiertag(iso);
    var es=d.eintraege.filter(function(e){return e.datum===iso;});
    var u=es.some(function(e){return e.typ==='U';}), k=es.some(function(e){return e.typ==='K';});
    var stunden=es.reduce(function(s,e){return s+std(e);},0), arbeit=es.some(function(e){return e.typ==='A';});
    var zu=d.abgeschlossen.indexOf(iso)>=0;
    var kl=['tag']; var unten='';
    if(u){ kl.push('urlaub'); unten=tr()?'İzin':'Urlaub'; }
    else if(k){ kl.push('krank'); unten=tr()?'Hasta':'Krank'; }
    else if(arbeit){ kl.push(zu?'zu':'arbeit'); unten=(stunden?fStd(stunden):'…')+(zu?' ✓':''); }
    else if(ft){ kl.push('ft'); unten=tr()?'Tatil':'Feiertag'; }
    else if(we) kl.push('we');
    if(fl && !(fl==='U'?u:k)) kl.push('dim');
    if(iso===heute) kl.push('heute');
    if(lauf && lauf.datum===iso) kl.push('laufend');
    h+='<button class="'+kl.join(' ')+'" onclick="tagDetail(\''+iso+'\')"><span class="n">'+t+'</span><span class="h">'+esc(unten)+'</span></button>';
  }
  h+='</div></div>';
  var s=d.eintraege.reduce(function(a,e){ if(e.typ==='U')a.u++; else if(e.typ==='K')a.k++; else {a.h+=std(e); a.t[e.datum]=1;} return a; },{h:0,u:0,k:0,t:{}});
  h+='<div class="summe"><div class="kachel"><div class="w">'+fStd(s.h)+'</div><div class="l">'+Lt('gesamt')+'</div></div><div class="kachel"><div class="w">'+Object.keys(s.t).length+'</div><div class="l">'+Lt('tage')+'</div></div>'+
     '<div class="kachel"><div class="w">'+s.u+'</div><div class="l">'+Lt('urlaub')+(d.urlaubKonto&&d.urlaubKonto.anspruch?'<br><b style="color:var(--blau)">'+(tr()?'Kalan ':'Rest ')+d.urlaubKonto.rest+' / '+d.urlaubKonto.anspruch+'</b>':'')+'</div></div><div class="kachel"><div class="w">'+s.k+'</div><div class="l">'+Lt('krank')+'</div></div></div>';
  if(d.gesperrt) h+='<div class="hinweis">🔒 '+Lt('gesperrt')+'</div>';
  if(mo!==monatVon(heute)) h+='<button class="mittel b-hell" onclick="S.kalMonat=monatVon(heuteIso());zeigeKalender()">'+L('zuHeute')+'</button><div style="height:8px"></div>';
  if(!d.gesperrt||S.nutzer.rolle==='admin') h+='<button class="mittel b-hell" onclick="abwesenheitForm()">🏖 '+L('abwesend')+'</button>';
  h+='<div class="legende"><span class="pill p-gruen">■ '+Lt('tagZu')+'</span><span class="pill" style="background:#fff;border:2px solid #9fd3ad;color:var(--gruen)">'+(tr()?'Açık / ':'')+'Offen</span><span class="pill p-blau">'+Lt('urlaub')+'</span><span class="pill p-rot">'+Lt('krank')+'</span><span class="pill p-grau">'+Lt('feiertag')+'</span></div>';
  if(fl) h+='<div class="karte jliste" id="jliste" style="margin-top:12px"><div class="leer">…</div></div>';
  $('inhalt').innerHTML=h;
  wischen($('kalwrap'), kalBlaettern);
  if(fl) jahresliste(ma, mo.slice(0,4), fl);
}
/** Jahresliste aller Urlaubs- bzw. Krankheitstage */
function jahresliste(ma, jahr, typ){
  S.jahre=S.jahre||{}; var k=ma+'|'+jahr;
  var zeigen=function(d){ var el=$('jliste'); if(!el||S.kalFilter!==typ) return;
    var tage=d.tage.filter(function(t){return t.typ===typ;}), proMon={};
    tage.forEach(function(t){ var m=t.datum.slice(0,7); (proMon[m]=proMon[m]||[]).push(t); });
    var h='<p class="titel">'+(typ==='U'?'🏖 '+Lt('urlaub'):'🤒 '+Lt('krank'))+' '+jahr+': '+tage.length+' '+(tr()?'gün / ':'')+'Tage</p>';
    if(typ==='U'&&d.urlaubKonto&&d.urlaubKonto.anspruch) h+='<div class="klein">'+(tr()?'Hak '+d.urlaubKonto.anspruch+' · kalan <b>'+d.urlaubKonto.rest+'</b><br>':'')+'Anspruch '+d.urlaubKonto.anspruch+' · davon vor der App '+(d.urlaubKonto.genommen-tage.length)+' · <b style="color:var(--blau)">Rest '+d.urlaubKonto.rest+'</b></div>';
    if(!tage.length) h+='<div class="leer">'+L('kein')+'</div>';
    Object.keys(proMon).sort().forEach(function(m){ var i=+m.slice(5,7)-1;
      h+='<div class="mon">'+(tr()?TR_MON[i]+' / ':'')+DE_MON[i]+' ('+proMon[m].length+')</div><div class="tage">'+proMon[m].map(function(t){
        var dt=dObj(t.datum); return '<button class="pill '+(typ==='U'?'p-blau':'p-rot')+'" onclick="S.kalMonat=\''+m+'\';zeigeKalender();setTimeout(function(){tagDetail(\''+t.datum+'\')},200)">'+(tr()?TR_KURZ[(dt.getDay()+6)%7]:DE_KURZ[(dt.getDay()+6)%7])+' '+dt.getDate()+'.</button>'; }).join('')+'</div>'; });
    el.innerHTML=h; };
  if(S.jahre[k]) return zeigen(S.jahre[k]);
  rufe('jahr',{ma:ma, jahr:jahr}).then(function(d){ S.jahre[k]=d; zeigen(d); }).catch(function(f){ var el=$('jliste'); if(el) el.innerHTML='<div class="leer">'+esc(fehlerText(f))+'</div>'; });
}
function kalBlaettern(r){
  var k=$('kal'); S.kalMonat=monatPlus(S.kalMonat, r>0?1:-1);
  if(k){ k.style.transform='translateX('+(r>0?-40:40)+'px)'; k.style.opacity='0'; setTimeout(zeigeKalender,140); } else zeigeKalender();
}
/** Wischgeste: links = +1, rechts = -1 */
function wischen(el, fn){
  if(!el) return; var x0=null,y0=null;
  el.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  el.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) fn(dx<0?1:-1); },{passive:true});
}
function tagDetail(iso){
  var ma=S.ansicht==='kalender'?(S.ma||S.nutzer.id):S.nutzer.id, d=monatDaten(ma,monatVon(iso));
  if(!d) return;
  var ft=feiertag(iso), es=d.eintraege.filter(function(e){return e.datum===iso;});
  var h='<h2>'+datumText(iso)+'</h2>';
  if(ft) h+='<div style="margin-bottom:10px"><span class="pill p-grau">🎉 '+Lt('feiertag')+': '+esc(ft)+'</span></div>';
  if(d.gesperrt && S.nutzer.rolle!=='admin') h+='<div class="hinweis">🔒 '+Lt('gesperrt')+'</div>';
  h+=eintragsListe(es, iso, d);
  oeffneBlatt(h);
}

/* ======================= Eintrag bearbeiten ======================= */

  var ma = S.ansicht==='kalender' ? (S.ma||S.nutzer.id) : S.nutzer.id;
  F = e || {id:null, ma:ma, datum:datum||heuteIso(), typ:'A', baustelle:S.auswahlBs||(S.baustellen[0]&&S.baustellen[0].id)||'', start:'07:00', ende:'16:00', pause:30, taetigkeit:'', material:[], km:''};

      return '<div class="mat"><input class="eing" inputmode="decimal" placeholder="'+(tr()?'Miktar':'Menge')+'" value="'+esc(m.menge)+'" data-i="'+i+'" data-k="menge">'+
        '<select class="eing" data-i="'+i+'" data-k="einheit">'+EINHEITEN.map(function(x){return '<option value="'+x[0]+'" '+(m.einheit===x[0]?'selected':'')+'>'+(tr()&&x[1]!==x[0]?x[1]+' / ':'')+x[0]+'</option>';}).join('')+'</select>'+
        '<input class="eing" placeholder="'+(tr()?'NYM 3x1,5':'z. B. NYM 3x1,5')+'" value="'+esc(m.text)+'" data-i="'+i+'" data-k="text">'+
        '<button class="x" onclick="formLesen();F.material.splice('+i+',1);if(!F.material.length)F.material.push({menge:\'\',einheit:\'Stk\',text:\'\'});zeichneForm()">✕</button></div>'; }).join('')+'</div>'+

  h+='<div class="reihe"><button class="mittel b-hell" onclick="schliesseBlatt()">'+L('abbrechen')+'</button>'+(e.id?'<button class="mittel" style="background:var(--rothell);color:var(--rot)" onclick="formLoeschen()">🗑 '+L('loeschen')+'</button>':'')+'</div>';

function formLesen(){
  if(!F) return; var v=function(id){ var el=$(id); return el?el.value:undefined; };
  if(v('fDatum')!==undefined) F.datum=v('fDatum');
  if(F.typ!=='A') return;
  if(v('fBs')!==undefined) F.baustelle=v('fBs'); if(v('fStart')!==undefined) F.start=v('fStart'); if(v('fEnde')!==undefined) F.ende=v('fEnde');
  if(v('fPause')!==undefined) F.pause=+v('fPause')||0; if(v('fTaet')!==undefined) F.taetigkeit=v('fTaet'); if(v('fKm')!==undefined) F.km=v('fKm');
  document.querySelectorAll('#fMat [data-i]').forEach(function(el){ F.material[+el.dataset.i][el.dataset.k]=el.value; });
}
function formSpeichern(){
  formLesen(); var e=JSON.parse(JSON.stringify(F));
  if(!e.datum){ return fFehler('Datum'); }
  if(e.typ==='A'){
    if(!e.baustelle) return fFehler(Lt('BAUSTELLE_FEHLT'));
    if(!e.start) return fFehler(Lt('beginn')+' ?');
    if(e.ende && minDiff(e.start,e.ende)<=0) return fFehler(Lt('ENDE_VOR_BEGINN'));
    e.material=e.material.filter(function(m){return String(m.text||'').trim();});
    e.km = e.km===''?'':String(e.km).replace(',','.');
  }
  var neu=!e.id; if(neu) e.id=uuid();
  var ma=e.ma||S.nutzer.id;
  var ziel = (neu && ma===S.nutzer.id) ? buchen('eintragSpeichern',{eintrag:e}) : rufe('eintragSpeichern',{eintrag:e}).then(function(m){ monatSetzen(m); });
  ziel.then(function(){
    // falls der laufende Eintrag bearbeitet wurde
    if(S.laufend && S.laufend.id===e.id && e.ende) S.laufend=null;
    schliesseBlatt(); toast('✓ '+Lt('speichern')); render();
  }).catch(function(f){ fFehler(fehlerText(f)); });
}
function fFehler(t){ $('fFehler').innerHTML='<div class="fehlerbox">'+esc(t)+'</div>'; }
function formLoeschen(){ var f=F; frage(L('sicherLoeschen'), L('loeschen'), function(){ F=f; loescheJetzt(); }); }
function loescheJetzt(){
  rufe('eintragLoeschen',{id:F.id, ma:F.ma, monat:monatVon(F.datum)}).then(function(m){ monatSetzen(m); if(S.laufend&&S.laufend.id===F.id) S.laufend=null; schliesseBlatt(); toast('🗑'); render(); })
    .catch(function(f){ fFehler(fehlerText(f)); });
}

function abwesenheitForm(){
  var h='<h2>'+L('abwesend')+'</h2><div class="seg" id="abwTyp"><button class="an" data-t="U" onclick="abwTyp(this)">🏖 '+L('urlaub')+'</button><button data-t="K" onclick="abwTyp(this)">🤒 '+L('krank')+'</button></div>'+

      '<div style="display:flex;gap:6px;align-items:center"><code id="ntfyThema" style="user-select:all;flex:1;background:#eef1f4;padding:10px;border-radius:10px;font-size:.85rem;word-break:break-all">'+esc(d.thema)+'</code>'+
      '<button class="pill p-blau" onclick="themaKopieren()">📋 '+(tr()?'Kopyala':'Kopieren')+'</button></div>'+
      '<div style="height:10px"></div><div class="reihe"><button class="mittel b-hell" onclick="pushTest()">🧪 '+(tr()?'Test / ':'')+'Test-Meldung</button><button class="mittel b-gruen" style="color:#fff" onclick="LS.setItem(\'ze_push_ok\',\'1\');pushKarte()">✓ '+(tr()?'Tamam / ':'')+'Klappt</button></div>';
  }).catch(function(f){ var p=$('pushInhalt'); if(p) p.textContent=fehlerText(f); });
}
function themaKopieren(){ var t=$('ntfyThema').textContent; try{ navigator.clipboard.writeText(t).then(function(){ toast('📋 '+(tr()?'Kopyalandı / ':'')+'Kopiert'); }, function(){ toast(t); }); }catch(e){ toast(t); } }
function pushTest(){ rufe('pushTest',{}).then(function(){ toast('🧪 '+(tr()?'Gönderildi – telefona bakın / ':'')+'Gesendet – aufs Handy schauen'); }).catch(function(f){ toast(fehlerText(f)); }); }
// Neue Nachrichten regelmäßig prüfen, solange die App offen ist
setInterval(function(){ if(S.token&&S.nutzer&&!document.hidden) rufe('meldungen',{}).then(function(d){ var vorher=S.ungelesen||0; S.nachr=d.liste; S.ungelesen=d.ungelesen; if(S.ansicht==='nachrichten') listeNachrichten(); if(d.ungelesen!==vorher) badgeAktualisieren(); }).catch(function(){}); }, 60000);
if(location.hash==='#nachrichten'){ S.ansicht='nachrichten'; try{ history.replaceState(null,'',location.pathname); }catch(e){} }

init();
</script>
